<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shadow">
<meta name="theme-color" content="#1D9E75">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>シャドーイング記録</title>
<style>
  :root {
    --green: #1D9E75;
    --green-light: #E1F5EE;
    --green-dark: #0F6E56;
    --bg: #f8f7f4;
    --surface: #ffffff;
    --surface2: #f1efe8;
    --text: #1a1a18;
    --text2: #6b6b67;
    --text3: #9e9e9a;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --radius: 12px;
    --radius-sm: 8px;
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121210;
      --surface: #1e1e1b;
      --surface2: #272724;
      --text: #f0efe8;
      --text2: #a0a09a;
      --text3: #686864;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.18);
      --green-light: #0a3328;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); font-family: -apple-system, 'Helvetica Neue', sans-serif; color: var(--text); }

  .app { max-width: 430px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  /* Header */
  .header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: calc(var(--safe-top) + 12px) 20px 12px;
    border-bottom: 0.5px solid var(--border);
  }
  .header-inner { display: flex; align-items: center; justify-content: space-between; }
  .app-title { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  .today-label { font-size: 13px; color: var(--text2); }

  /* Tab bar */
  .tabs {
    display: flex; background: var(--bg);
    border-bottom: 0.5px solid var(--border);
    padding: 0 20px;
  }
  .tab {
    flex: 1; padding: 10px 0; font-size: 13px; font-weight: 500;
    color: var(--text3); border: none; background: none; cursor: pointer;
    border-bottom: 2px solid transparent; transition: all 0.15s;
  }
  .tab.active { color: var(--green); border-bottom-color: var(--green); }

  /* Content */
  .content { flex: 1; padding: 20px; padding-bottom: calc(var(--safe-bottom) + 20px); overflow-y: auto; }
  .page { display: none; }
  .page.active { display: block; }

  /* Stats row */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat { background: var(--surface2); border-radius: var(--radius-sm); padding: 12px 8px; text-align: center; }
  .stat-val { font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: -1px; line-height: 1; }
  .stat-label { font-size: 11px; color: var(--text2); margin-top: 4px; }

  /* Streak highlight */
  .streak-banner {
    background: var(--green-light); border-radius: var(--radius); padding: 14px 16px;
    display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
  }
  .streak-fire { font-size: 32px; }
  .streak-text { font-size: 15px; font-weight: 600; color: var(--green-dark); }
  .streak-sub { font-size: 12px; color: var(--green); margin-top: 2px; }

  /* Check-in card */
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .card-title { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
  .field-label { font-size: 12px; color: var(--text2); margin-bottom: 8px; display: block; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    border: 1px solid var(--border2); border-radius: 999px;
    padding: 6px 14px; font-size: 13px; cursor: pointer;
    background: var(--surface); color: var(--text); transition: all 0.12s;
    -webkit-user-select: none; user-select: none;
  }
  .chip.on { background: var(--green); border-color: var(--green); color: #fff; }

  .slider-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .slider-row input[type=range] {
    flex: 1; -webkit-appearance: none; height: 4px;
    background: var(--border2); border-radius: 2px; outline: none;
  }
  .slider-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px;
    border-radius: 50%; background: var(--green);
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .dur-disp { font-size: 14px; font-weight: 600; min-width: 44px; text-align: right; color: var(--text); }

  textarea {
    width: 100%; border: 0.5px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 12px; font-size: 14px; font-family: inherit;
    color: var(--text); background: var(--bg); resize: none;
    margin-bottom: 14px; line-height: 1.5;
  }
  textarea:focus { outline: none; border-color: var(--green); }
  textarea::placeholder { color: var(--text3); }

  .btn {
    width: 100%; padding: 13px; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 600; border: none; cursor: pointer;
    background: var(--green); color: #fff; transition: opacity 0.15s;
    letter-spacing: -0.2px;
  }
  .btn:active { opacity: 0.8; }
  .btn.done { background: var(--surface2); color: var(--text2); }

  /* Calendar */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-nav { background: none; border: none; font-size: 20px; color: var(--text2); cursor: pointer; padding: 4px 8px; }
  .cal-month { font-size: 15px; font-weight: 600; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .day-label { font-size: 11px; color: var(--text3); text-align: center; padding: 4px 0; }
  .day {
    aspect-ratio: 1; border-radius: var(--radius-sm); display: flex;
    align-items: center; justify-content: center; font-size: 13px;
    color: var(--text2);
  }
  .day.done { background: var(--green); color: #fff; font-weight: 600; }
  .day.today { outline: 2px solid var(--green); outline-offset: 2px; color: var(--text); font-weight: 600; }
  .day.future { color: var(--text3); }

  /* Log list */
  .log-empty { text-align: center; color: var(--text3); font-size: 14px; padding: 40px 0; }
  .log-item {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 10px;
  }
  .log-date { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
  .log-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .log-min { font-size: 13px; font-weight: 600; color: var(--green); }
  .log-chip { font-size: 11px; background: var(--green-light); color: var(--green-dark); border-radius: 999px; padding: 2px 9px; }
  .log-note { font-size: 13px; color: var(--text2); margin-top: 6px; line-height: 1.4; }

  /* Badges */
  .badges-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
  .badge {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 14px; text-align: center;
    opacity: 0.35; transition: opacity 0.3s;
  }
  .badge.earned { opacity: 1; border-color: var(--green); }
  .badge-icon { font-size: 28px; margin-bottom: 6px; }
  .badge-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .badge-desc { font-size: 11px; color: var(--text2); margin-top: 3px; line-height: 1.3; }

  /* Toast */
  .toast {
    position: fixed; bottom: calc(var(--safe-bottom) + 24px);
    left: 50%; transform: translateX(-50%) translateY(80px);
    background: #1a1a18; color: #fff; padding: 11px 20px;
    border-radius: 999px; font-size: 14px; font-weight: 500;
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none; z-index: 999; white-space: nowrap;
    max-width: 90vw; text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Install banner */
  .install-banner {
    background: var(--green-light); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 16px; font-size: 13px;
    color: var(--green-dark); line-height: 1.5; display: none;
  }
  .install-banner.show { display: block; }
  .install-banner strong { font-weight: 600; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-inner">
      <div class="app-title">🎤 シャドーイング記録</div>
      <div class="today-label" id="hdr-date"></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('home',this)">ホーム</button>
    <button class="tab" onclick="switchTab('log',this)">ログ</button>
    <button class="tab" onclick="switchTab('badges',this)">バッジ</button>
  </div>

  <div class="content">

    <!-- HOME -->
    <div id="page-home" class="page active">
      <div class="install-banner" id="install-banner">
        📱 <strong>ホーム画面に追加する方法</strong><br>
        Safariの共有ボタン（↑）→「ホーム画面に追加」でアプリとして使えます。
      </div>

      <div class="stats-row">
        <div class="stat">
          <div class="stat-val" id="s-streak">0</div>
          <div class="stat-label">🔥 連続日数</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="s-month">0</div>
          <div class="stat-label">今月の日数</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="s-total">0</div>
          <div class="stat-label">累計（分）</div>
        </div>
      </div>

      <div class="streak-banner" id="streak-banner" style="display:none">
        <div class="streak-fire">🔥</div>
        <div>
          <div class="streak-text" id="streak-text"></div>
          <div class="streak-sub">この調子で続けよう</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">今日のチェックイン</div>
        <span class="field-label">使った素材</span>
        <div class="chips">
          <div class="chip" onclick="toggleChip(this)">TED</div>
          <div class="chip" onclick="toggleChip(this)">BBC</div>
          <div class="chip" onclick="toggleChip(this)">CNN 10</div>
          <div class="chip" onclick="toggleChip(this)">シャドテン</div>
          <div class="chip" onclick="toggleChip(this)">Podcast</div>
          <div class="chip" onclick="toggleChip(this)">その他</div>
        </div>
        <span class="field-label">練習時間</span>
        <div class="slider-row">
          <input type="range" min="5" max="60" step="5" value="30" id="dur-slider"
            oninput="document.getElementById('dur-disp').textContent=this.value+'分'">
          <span class="dur-disp" id="dur-disp">30分</span>
        </div>
        <span class="field-label">メモ（任意）</span>
        <textarea id="note" rows="2" placeholder="気づいたこと、難しかった表現など..."></textarea>
        <button class="btn" id="checkin-btn" onclick="doCheckin()">今日のシャドーイング完了！</button>
      </div>

      <div style="margin-bottom:8px; font-size:14px; font-weight:600;" id="cal-month-title"></div>
      <div class="cal-grid" id="calendar"></div>
    </div>

    <!-- LOG -->
    <div id="page-log" class="page">
      <div id="log-list"></div>
    </div>

    <!-- BADGES -->
    <div id="page-badges" class="page">
      <div class="badges-grid" id="badges-grid"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BADGES_DEF = [
  { id:'first',    icon:'🎤', name:'First Step',  desc:'初めてのチェックイン' },
  { id:'week',     icon:'🔥', name:'7日連続',      desc:'7日間ストリーク達成' },
  { id:'streak14', icon:'💎', name:'2週間の証',    desc:'14日連続達成' },
  { id:'streak30', icon:'🏆', name:'1ヶ月マスター', desc:'30日連続達成' },
  { id:'ted',      icon:'🎙️', name:'TED Fan',      desc:'TED素材を5回以上使用' },
  { id:'time100',  icon:'⏱️', name:'100分突破',    desc:'累計練習100分達成' },
  { id:'time300',  icon:'⚡', name:'300分の壁',    desc:'累計練習300分達成' },
  { id:'month15',  icon:'📅', name:'半月達成',     desc:'今月15日以上実施' },
];

function key(d){ return d.toISOString().slice(0,10); }
function todayKey(){ return key(new Date()); }

function load(k, def){ try{ return JSON.parse(localStorage.getItem(k)||'null') ?? def; }catch(e){ return def; } }
function save(k,v){ localStorage.setItem(k,JSON.stringify(v)); }

function getLog(){ return load('shadow_log',[]); }
function saveLog(l){ save('shadow_log',l); }
function getEarned(){ return load('shadow_earned',[]); }
function saveEarned(e){ save('shadow_earned',e); }

function totalMin(log){ return log.reduce((a,e)=>a+(e.min||0),0); }
function thisMonthCount(log){
  const ym = new Date().toISOString().slice(0,7);
  return log.filter(e=>e.date.startsWith(ym)).length;
}
function calcStreak(log){
  const dates = new Set(log.map(e=>e.date));
  let s=0; const n=new Date();
  if(!dates.has(key(n))){ n.setDate(n.getDate()-1); }
  while(dates.has(key(n))){ s++; n.setDate(n.getDate()-1); }
  return s;
}
function checkBadges(log, streak){
  const earned = getEarned();
  const total = totalMin(log);
  const mc = thisMonthCount(log);
  const tedCount = log.filter(e=>e.mat&&e.mat.includes('TED')).length;
  const checks = {
    first:    log.length >= 1,
    week:     streak >= 7,
    streak14: streak >= 14,
    streak30: streak >= 30,
    ted:      tedCount >= 5,
    time100:  total >= 100,
    time300:  total >= 300,
    month15:  mc >= 15,
  };
  const newly = [];
  BADGES_DEF.forEach(b=>{ if(checks[b.id]&&!earned.includes(b.id)){ earned.push(b.id); newly.push(b.name); } });
  saveEarned(earned);
  return newly;
}

function renderStats(){
  const log = getLog();
  const streak = calcStreak(log);
  document.getElementById('s-streak').textContent = streak;
  document.getElementById('s-month').textContent = thisMonthCount(log);
  document.getElementById('s-total').textContent = totalMin(log);
  const banner = document.getElementById('streak-banner');
  if(streak >= 2){
    document.getElementById('streak-text').textContent = streak+'日連続中！';
    banner.style.display='flex';
  } else { banner.style.display='none'; }
}

function renderCalendar(){
  const log = getLog();
  const dates = new Set(log.map(e=>e.date));
  const n = new Date();
  const y = n.getFullYear(), m = n.getMonth();
  document.getElementById('cal-month-title').textContent = `${y}年${m+1}月`;
  const firstDay = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const todayStr = todayKey();
  const grid = document.getElementById('calendar');
  grid.innerHTML='';
  ['日','月','火','水','木','金','土'].forEach(d=>{
    const el=document.createElement('div'); el.className='day-label'; el.textContent=d; grid.appendChild(el);
  });
  for(let i=0;i<firstDay;i++){ grid.appendChild(document.createElement('div')); }
  for(let d=1;d<=daysInMonth;d++){
    const k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const el=document.createElement('div'); el.className='day'; el.textContent=d;
    if(dates.has(k)) el.classList.add('done');
    if(k===todayStr) el.classList.add('today');
    if(d>n.getDate()) el.classList.add('future');
    grid.appendChild(el);
  }
}

function renderLog(){
  const log = getLog().slice().reverse();
  const el = document.getElementById('log-list');
  if(!log.length){ el.innerHTML='<div class="log-empty">まだ記録がありません</div>'; return; }
  el.innerHTML = log.map(e=>{
    const d = new Date(e.date);
    const dateStr = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
    const chips = (e.mat||[]).map(m=>`<span class="log-chip">${m}</span>`).join('');
    const note = e.note ? `<div class="log-note">${e.note}</div>`:'';
    return `<div class="log-item">
      <div class="log-date">${dateStr}</div>
      <div class="log-meta"><span class="log-min">${e.min}分</span>${chips}</div>
      ${note}
    </div>`;
  }).join('');
}

function renderBadges(){
  const earned = getEarned();
  const grid = document.getElementById('badges-grid');
  grid.innerHTML = BADGES_DEF.map(b=>`
    <div class="badge ${earned.includes(b.id)?'earned':''}">
      <div class="badge-icon">${b.icon}</div>
      <div class="badge-name">${b.name}</div>
      <div class="badge-desc">${b.desc}</div>
    </div>
  `).join('');
}

function toggleChip(el){ el.classList.toggle('on'); }

function doCheckin(){
  const log = getLog();
  const t = todayKey();
  if(log.find(e=>e.date===t)){ showToast('今日はチェックイン済みです！'); return; }
  const mat = Array.from(document.querySelectorAll('.chip.on')).map(c=>c.textContent);
  const min = parseInt(document.getElementById('dur-slider').value);
  const note = document.getElementById('note').value.trim();
  log.push({date:t, mat, min, note});
  saveLog(log);
  const streak = calcStreak(log);
  const newly = checkBadges(log, streak);
  renderAll();
  setCheckinDone();
  if(newly.length){ setTimeout(()=>showToast('🏅 バッジ取得: '+newly.join(', ')),350); }
  else if(streak>=2){ showToast(`🔥 ${streak}日連続！この調子！`); }
  else { showToast('✅ 記録完了！お疲れ様でした'); }
}

function setCheckinDone(){
  const btn = document.getElementById('checkin-btn');
  btn.textContent='今日は記録済みです'; btn.classList.add('done'); btn.onclick=null;
}

function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

function switchTab(id, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='log') renderLog();
  if(id==='badges') renderBadges();
}

function renderAll(){
  renderStats(); renderCalendar(); renderBadges();
}

function init(){
  const n=new Date();
  document.getElementById('hdr-date').textContent=`${n.getMonth()+1}/${n.getDate()}`;
  renderAll();
  const log=getLog();
  if(log.find(e=>e.date===todayKey())) setCheckinDone();
  const isStandalone=window.navigator.standalone;
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(isIOS&&!isStandalone) document.getElementById('install-banner').classList.add('show');
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
}
init();
</script>
</body>
</html>
